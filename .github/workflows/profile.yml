# Re-render the profile images daily and publish them to the `output` branch,
# then deploy the interactive War Room (site/) to GitHub Pages.
# The README points at raw.githubusercontent.com/<owner>/<repo>/output/<file>.svg
name: profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generator/**"
      - "assets/**"
      - "site/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The orbit recording renders ~150 software-WebGL frames, so the job gets room beyond the old 15 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The contribution calendar (incl. private counts shown on the profile)
      # is readable with the default token; PROFILE_TOKEN is an optional override.
      - name: Fetch contribution stats
        run: python generator/fetch.py
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Render SVGs
        run: python generator/build.py

      # Pages publishes only site/, so the static fallback images and the
      # snapshot are staged inside it (index.html references ./battlefield-*.svg).
      - name: Stage War Room site
        run: |
          cp data/stats.json site/stats.json
          cp dist/battlefield-light.svg dist/battlefield-dark.svg site/

      - name: Verify renderers and aggregate calculations
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Check profile artifacts
        run: python scripts/check.py

      # Playwright and Pillow are needed only by the card and the orbit recording, so they are
      # installed once here, after the tests and checks that do not use them.
      - name: Install Playwright and Pillow
        run: |
          pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium

      # Link previews cannot render SVG, so the card is a PNG screenshot of the light
      # battlefield (site/card.png, named by og:image).
      - name: Render social card
        run: python scripts/render_card.py

      # The README's 3D preview: dist/orbit-{light,dark}.webp, published below with the SVGs.
      # Best effort, so a rendering hiccup can never block the daily data refresh:
      #  1. keep_history is false, so the output branch is rebuilt from dist/ alone; the previous
      #     recordings are therefore copied back into dist/ first (a failed download is ignored).
      #  2. record_orbit.py writes each file atomically only after validating it, so a failed run
      #     leaves the restored files untouched.
      #  3. continue-on-error lets the job go on to publish whatever dist/ holds.
      - name: Restore previous orbit recordings
        continue-on-error: true
        run: |
          for mode in light dark; do
            curl -fsSL --retry 2 --max-time 60 -o "dist/orbit-$mode.webp" \
              "https://raw.githubusercontent.com/${{ github.repository }}/output/orbit-$mode.webp" \
              || rm -f "dist/orbit-$mode.webp"
          done

      - name: Record orbit preview
        id: orbit
        continue-on-error: true
        timeout-minutes: 12
        run: python scripts/record_orbit.py

      - name: Report orbit result
        if: steps.orbit.outcome == 'failure'
        run: echo "::warning title=Orbit preview::Recording failed; publishing the previous orbit-*.webp (if any) unchanged."

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
          commit_message: "Update profile images"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
